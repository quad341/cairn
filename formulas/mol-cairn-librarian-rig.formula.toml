description = """
Thin rig-tier wrapper around mol-cairn-librarian: identical steps, but var
defaults are fixed to tier="rig", rig="cairn" instead of tier="global".

Exists because cooldown/condition order dispatch carries vars=nil -- an
order's [params] only validate that a var is present, they cannot supply a
value (only webhook/manual dispatch carry vars). Under vars=nil,
mol-cairn-librarian falls back to its own defaults (tier="global"), which is
the fleet-wide, mayor-owned singleton sweep -- wrong owner for a cairn-rig
cooldown order (crn-gc9m.2 non-goals). This formula supplies the rig-tier
defaults instead, so a bare `bd mol pour mol-cairn-librarian-rig` (no --var
flags) already resolves to the correct tier/rig.

bd's formula system has no alias/extends/include mechanism (bd formula
--help / bd mol --help), so this is a full structural duplicate of
mol-cairn-librarian.formula.toml's steps, not a reference to it --
formulas/formulas_test.go's TestLibrarianRigFormulaHasSameStepsAsLibrarian
guards the two from drifting apart. See that formula for the steps' own
documentation; only the vars below differ.

Consumer: packs/cairn-loop-orders/orders/cairn-librarian-rig-cooldown.toml
(cairn/builder territory ends here -- pointing that order's `formula =` at
this file and flipping `enabled = true` is pack-author territory; see that
pack's own README activation checklist).
"""
formula = "mol-cairn-librarian-rig"
version = 1
phase = "vapor"

[vars]
[vars.tier]
description = "Fixed to \"rig\" -- this wrapper exists specifically to supply a non-global default under vars=nil dispatch. To run a differently-tiered sweep, pour mol-cairn-librarian directly with an explicit --var tier=... instead."
default = "rig"

[vars.rig]
description = "Fixed to \"cairn\" -- the rig this wrapper is scoped to (crn-gc9m.2 non-goals: this formula is not fleet-generic)."
default = "cairn"

[vars.cooldown]
description = "Minimum wall-clock gap the loop step recommends before the next pour of this same tier (and rig, if set) -- a documented convention, not a mechanically enforced gate."
default = "24h"

[[steps]]
id = "stale-review-branch-recovery"
title = "Validate tier/rig, then reactively re-notify a stale review branch's reviewer and escalate to a bd bead if still unactioned"
description = '''
Before any sweep work: validate the tier/rig variables this pour was given.
"role" is a deliberate rejection, not an oversight -- see the formula's
top-level description for why role-tier is out of v0 scope.

  case "{{tier}}" in
    global) ;;
    rig)
      if [ -z "{{rig}}" ]; then
        echo "mol-cairn-librarian: tier=rig requires a non-empty rig variable, e.g. --var rig=<rig-name>" >&2
        exit 1
      fi
      ;;
    *)
      echo "mol-cairn-librarian: tier must be 'global' or 'rig' (got '{{tier}}'); role-tier is explicitly out of v0 scope, see this formula's description" >&2
      exit 1
      ;;
  esac

Run "cairn stale-branches" (crn-0yv.1). It reactively re-mails the resolved
reviewer for any branch past --notify-after in-process (reusing crn-419.6's
reviewer resolution) and reports every branch's status as JSON -- this step's
own job is only the escalate half: file a bd bead for each escalate-status
finding, deduplicated across cycles. This step never merges or rewrites a
review branch itself, per crn-xw3 guardrail 8 -- only mails a reviewer
(delegated to the "cairn stale-branches" call above) or files a bead.

IMPORTANT before pasting this step as-is: "cairn stale-branches"'s escalate
guarantee depends on --state-file persisting across sweep passes (see
"Design decision: two absolute-age thresholds, plus minimal per-SHA notify
state" above). Confirm $STORE is a durable checkout this formula reuses
pass to pass; if it's instead re-cloned fresh every sweep tick, add
--state-file pointing at a separately durable path to the invocation below
-- otherwise escalate silently never fires.

  STORE="${CAIRN_STORE:?CAIRN_STORE must be set}"
  FILED=0
  SKIPPED=0

  # See the --state-file persistence note above this script: the
  # "cairn stale-branches --store $STORE" call below only retains
  # cross-pass notify state if $STORE itself persists call to call.
  while IFS= read -r finding; do
    BRANCH=$(printf '%s' "$finding" | jq -r '.branch')
    ENTRY_ID=$(printf '%s' "$finding" | jq -r '.entry_id')
    TIER=$(printf '%s' "$finding" | jq -r '.tier')
    AGE_SECONDS=$(printf '%s' "$finding" | jq -r '.age_seconds')
    REVIEWER=$(printf '%s' "$finding" | jq -r '.reviewer')

    EXISTING=$(bd list --label=dim:review-branch,source:cairn-librarian \
      --title-contains="on $BRANCH (" --json --no-pager 2>/dev/null | jq -r '.[0].id // empty')

    if [ -n "$EXISTING" ]; then
      echo "skip $BRANCH: already tracked as $EXISTING"
      SKIPPED=$((SKIPPED + 1))
      continue
    fi

    NEW_ID=$(bd create \
        --title="cairn librarian: stale review branch on $BRANCH ($TIER)" \
        --stdin --type=task --priority=3 \
        --labels=dim:review-branch,source:cairn-librarian --silent <<BODY
Review branch "$BRANCH" (entry $ENTRY_ID, tier $TIER) has been unmerged for
${AGE_SECONDS}s. A reminder mail was already sent to $REVIEWER on an earlier
cairn stale-branches pass at this same commit, and it is now past the
escalate threshold with no merge and no new commit since.

Filed by the mol-cairn-librarian stale-review-branch-recovery step
(crn-0yv.1). This is a proposal only: it never merges the branch itself. To
resolve, $REVIEWER (or another reviewer) should review and merge the branch
into the store's default branch, or an author should update it -- either
action removes the branch from future "cairn stale-branches" output.
BODY
    )
    echo "filed $NEW_ID for $BRANCH"
    FILED=$((FILED + 1))
  done < <(cairn stale-branches --store "$STORE" | jq -c '.[] | select(.status == "escalate")')

  echo "librarian stale-branch recovery: $FILED bead(s) filed, $SKIPPED already tracked"
'''

[[steps]]
id = "freshness-drift-beads"
title = "File a bd bead for every non-fresh cairn sweep finding, deduplicated across cycles"
needs = ["stale-review-branch-recovery"]
description = '''
Run the read-only freshness sweep (crn-0yv.2) and turn every non-fresh
finding into exactly one open bd bead. A single Stale/Unknown observation is
enough to file (see docs/plans/cairn-librarian-freshness-drift-beads.md for
why persistence-gating across cycles isn't needed) -- "not a duplicate per
cycle" comes from checking bd for an already-open bead before creating a new
one. This step only ever calls "cairn sweep" (read-only) and "bd list"/"bd
create" (bd's own store) -- it never rewrites a cairn entry, per crn-xw3
guardrail 8.

  STORE="${CAIRN_STORE:?CAIRN_STORE must be set}"
  FILED=0
  SKIPPED=0

  while IFS= read -r finding; do
    ID=$(printf '%s' "$finding" | jq -r '.id')
    TIER=$(printf '%s' "$finding" | jq -r '.tier')
    STATUS=$(printf '%s' "$finding" | jq -r '.status')
    DETAIL=$(printf '%s' "$finding" | jq -r '.detail')
    ANCHOR=$(printf '%s' "$finding" | jq -r '.anchor_type')

    EXISTING=$(bd list --label=dim:freshness,source:cairn-librarian \
      --title-contains="on $ID (" --json --no-pager 2>/dev/null | jq -r '.[0].id // empty')

    if [ -n "$EXISTING" ]; then
      echo "skip $ID ($STATUS): already tracked as $EXISTING"
      SKIPPED=$((SKIPPED + 1))
      continue
    fi

    NEW_ID=$(bd create \
        --title="cairn librarian: $STATUS freshness on $ID ($TIER)" \
        --stdin --type=task --priority=3 \
        --labels=dim:freshness,source:cairn-librarian --silent <<BODY
Sweep detected $STATUS freshness for shared-tier cairn entry "$ID" (tier: $TIER, anchor: $ANCHOR).

$DETAIL

Filed by the mol-cairn-librarian freshness-sweep step (crn-0yv.2). This is a
proposal only: the sweep step itself never rewrites an already-curated entry
(crn-xw3 guardrail 8) and never calls "cairn verify" on your behalf. To
resolve, a reviewer or the entry's original author should inspect the
anchor, then either re-run "cairn verify $ID" once the source has settled,
re-anchor the entry, or retire it if it no longer applies.
BODY
    )
    echo "filed $NEW_ID for $ID ($STATUS)"
    FILED=$((FILED + 1))
  done < <(cairn sweep --store "$STORE" | jq -c '.[] | select(.status != "fresh")')

  echo "librarian freshness sweep: $FILED bead(s) filed, $SKIPPED already tracked"
'''

[[steps]]
id = "dedup-candidate-beads"
title = "File a bd bead for every cairn dedup/re-scope candidate, deduplicated across cycles"
needs = ["freshness-drift-beads"]
description = '''
Run the read-only dedup/re-scope detector (crn-0yv.3) and turn every
finding into exactly one open bd bead. "Not a duplicate per cycle" comes
from checking bd for an already-open bead whose title contains this
finding's bracket-delimited anchor token before creating a new one (see
docs/plans/cairn-librarian-dedup-detection-beads.md for why a bracket token
rather than a natural-language phrase, and for the deliberate limitation
around growing topic_key groups). This step only ever calls "cairn dedup"
(read-only) and "bd list"/"bd create" (bd's own store) -- it never merges,
deletes, or rewrites a cairn entry, per crn-xw3 guardrail 8.

  STORE="${CAIRN_STORE:?CAIRN_STORE must be set}"
  FILED=0
  SKIPPED=0

  while IFS= read -r finding; do
    KIND=$(printf '%s' "$finding" | jq -r '.kind')
    IDS_CSV=$(printf '%s' "$finding" | jq -r '.entry_ids | join(",")')
    DETAIL=$(printf '%s' "$finding" | jq -r '.detail')

    if [ "$KIND" = "content" ]; then
      ID_LO=$(printf '%s' "$finding" | jq -r '.entry_ids[0]')
      ID_HI=$(printf '%s' "$finding" | jq -r '.entry_ids[1]')
      SCORE=$(printf '%s' "$finding" | jq -r '.similarity')
      ANCHOR="[pair:${ID_LO}|${ID_HI}]"
      TITLE="cairn librarian: content-similarity dup ${ANCHOR} (score ${SCORE})"
    else
      KEY=$(printf '%s' "$finding" | jq -r '.topic_key')
      TIER=$(printf '%s' "$finding" | jq -r '.tier')
      ANCHOR="[ids:${IDS_CSV}]"
      TITLE="cairn librarian: topic_key collision \"${KEY}\" in tier ${TIER} ${ANCHOR}"
    fi

    EXISTING=$(bd list --label=dim:dedup,source:cairn-librarian \
      --title-contains="$ANCHOR" --json --no-pager 2>/dev/null | jq -r '.[0].id // empty')

    if [ -n "$EXISTING" ]; then
      echo "skip $KIND $ANCHOR: already tracked as $EXISTING"
      SKIPPED=$((SKIPPED + 1))
      continue
    fi

    NEW_ID=$(bd create \
        --title="$TITLE" \
        --stdin --type=task --priority=3 \
        --labels=dim:dedup,source:cairn-librarian --silent <<BODY
Sweep detected a $KIND duplicate/re-scope candidate across shared-tier cairn entries: $IDS_CSV.

$DETAIL

Filed by the mol-cairn-librarian dedup-detection step (crn-0yv.3). This is a
proposal only: the step itself never merges, deletes, or rewrites an entry
(crn-xw3 guardrail 8). To resolve, a reviewer or the entries' authors should
compare them and decide whether to consolidate, re-scope one of them, or
close this bead as a false positive (e.g. two same-tier entries that
legitimately picked the same topic_key for unrelated reasons).
BODY
    )
    echo "filed $NEW_ID for $KIND $ANCHOR"
    FILED=$((FILED + 1))
  done < <(cairn dedup --store "$STORE" | jq -c '.[]')

  echo "librarian dedup sweep: $FILED bead(s) filed, $SKIPPED already tracked"
'''

[[steps]]
id = "promote-candidate-beads"
title = "File a bd bead for every cairn recurrence-promotion candidate, deduplicated across cycles"
needs = ["dedup-candidate-beads"]
description = '''
Run the read-only recurrence-promotion detector (crn-28ge.1.6) and turn every
finding into exactly one open bd bead proposing a durable fix (FR-07), then
immediately persists the promotion via "cairn promote-mark <entry-id> --bead
<bead-id>" using the ID "bd create" just returned -- mirrors how
crn-28ge.1.4's capture-time recurrence path calls WriteBackRecurrenceCount
right after incrementing RecurrenceCount, one layer up in this formula step
instead of Go code (crn-ghn8.2).
"Not a duplicate per cycle" comes from checking bd for an already-open bead
whose title contains this finding's bracket-delimited entry anchor before
creating a new one -- the same idiom the other steps above already use; that
same check also keeps "cairn promote-mark" from ever being re-attempted for
an entry a prior cycle already marked, since an already-tracked finding
short-circuits the whole iteration before either call runs. This step calls
"cairn promote-candidates" (read-only), "bd list"/"bd create" (bd's own
store), and "cairn promote-mark" -- the last of these does mutate the
entry's promoted_bead_id, but only through the same tier-conditional
dispatch crn-ghn8.1 shipped for every other automated bookkeeping field: a
direct commit for private/agent-tier entries, a review-branch proposal for
shared (rig/global) tier -- never a direct rewrite of a shared-tier entry
outside that review flow, per crn-xw3 guardrail 8.

Each finding's anchor_repo names the repo/tracker the recurring topic
actually belongs to, which is very often NOT the repo this sweep happens to
be running in (crn-78d precedent: get the tracker right, don't default to
wherever the librarian runs). Cairn/bd have no general mechanism to file a
bead directly into an arbitrary named repo's own tracker ("bd create --repo"
only overrides auto-routing among repos already registered in *this* store's
own .beads/config.yaml via "bd repo add", which anchor_repo is not expected
to be) -- so this step files the proposal locally, with anchor_repo made
unmissable in the title and a machine-readable target-repo label, and
explicit body text that it still needs routing to that repo's own tracker.
This mirrors both cmd/critic_filebead.go's FileCriticBead (files locally,
leaves routing beyond that to the fleet's normal ready-to-build/needs-pm
pipeline) and this fleet's own cairn-bead-fix-lives-in-different-rig
convention: label clearly, let a human/PM route cross-repo, never guess an
unsupported cross-store write.

  STORE="${CAIRN_STORE:?CAIRN_STORE must be set}"
  FILED=0
  SKIPPED=0

  while IFS= read -r finding; do
    ENTRY_ID=$(printf '%s' "$finding" | jq -r '.entry_id')
    TOPIC_KEY=$(printf '%s' "$finding" | jq -r '.topic_key')
    COUNT=$(printf '%s' "$finding" | jq -r '.recurrence_count')
    ANCHOR_REPO=$(printf '%s' "$finding" | jq -r '.anchor_repo')
    ANCHOR="[entry:${ENTRY_ID}]"

    EXISTING=$(bd list --label=dim:promote,source:cairn-librarian \
      --title-contains="$ANCHOR" --json --no-pager 2>/dev/null | jq -r '.[0].id // empty')

    if [ -n "$EXISTING" ]; then
      echo "skip $ENTRY_ID: already tracked as $EXISTING"
      SKIPPED=$((SKIPPED + 1))
      continue
    fi

    NEW_ID=$(bd create \
        --title="cairn librarian: recurring topic \"$TOPIC_KEY\" needs a fix in $ANCHOR_REPO $ANCHOR" \
        --stdin --type=task --priority=3 \
        --labels="dim:promote,source:cairn-librarian,target-repo:$ANCHOR_REPO" --silent <<BODY
Cairn entry $ENTRY_ID (topic "$TOPIC_KEY") has recurred $COUNT time(s),
crossing the promote threshold (FR-07).

This proposes a durable fix in $ANCHOR_REPO -- NOT necessarily this repo.
Filed by the mol-cairn-librarian promote-candidate-beads step (crn-28ge.1.8),
which files locally and leaves cross-repo routing to the fleet's normal
triage pipeline (no general mechanism exists here to bd-create directly into
an arbitrary named repo/tracker -- see this step's own description). To
resolve: confirm $ANCHOR_REPO is the right tracker, route/refile this bead
there if it differs from where this bead landed, then close this proposal
once the durable fix is tracked in the right place.
BODY
    )

    if ! cairn promote-mark "$ENTRY_ID" --bead "$NEW_ID" --store "$STORE"; then
      echo "cairn promote-mark $ENTRY_ID --bead $NEW_ID failed (bead filed; promotion mark not persisted)" >&2
    fi

    echo "filed $NEW_ID for $ENTRY_ID ($TOPIC_KEY -> $ANCHOR_REPO)"
    FILED=$((FILED + 1))
  done < <(cairn promote-candidates --store "$STORE" | jq -c '.[]')

  echo "librarian promote sweep: $FILED bead(s) filed, $SKIPPED already tracked"
'''

[[steps]]
id = "cull-candidate-beads"
title = "Propose review-branch eviction for every rig/global-tier cairn cull-candidate, deduplicated across cycles"
needs = ["promote-candidate-beads"]
description = '''
Run the read-only disuse detector (crn-28ge.1.7) and, for every rig- or
global-tier finding, trigger a review-branch eviction proposal via "cairn
cull-evict" -- never a direct delete. Role-tier is out of scope for the same
reason it's out of scope for the rest of this formula (see the top-level
description); agent-tier is private and handled by each agent's own
opportunistic self-sweep, not this shared-tier formula. Tier is resolved
from each finding's scope array with the same rig > role > agent precedence
(global as the fallback) as internal/cairn/remember.go's ResolvedTier,
replicated here in shell since this step has no access to the Go binary's
internals.

"cairn cull-evict" is where the never-a-direct-delete guarantee actually
lives (cmd/cull.go: any non-private scope always takes the review-branch
path, via EvictToReviewBranch plus a mail to the tier's reviewer) -- this
step's own job is only to decide which findings are in scope (rig/global
tier) and avoid re-triggering an eviction proposal already made. That
dedup check must run BEFORE calling "cairn cull-evict", not after:
EvictToReviewBranch's review branch is named deterministically ("cull/" +
entry ID) and a second call for the same entry is a hard error, not a
no-op, so re-invoking it once a proposal already exists would fail loudly
every cycle instead of skipping quietly. This step only ever calls "cairn
cull-candidates" (read-only), "cairn cull-evict" (opens a review branch and
mails a reviewer, never a direct delete for rig/global scope), and "bd
list"/"bd create" (bd's own store) -- it never merges, deletes, or rewrites
a cairn entry directly, per crn-xw3 guardrail 8: nothing is evicted until a
human reviewer merges the proposal branch.

  STORE="${CAIRN_STORE:?CAIRN_STORE must be set}"
  FILED=0
  SKIPPED=0

  # Mirrors internal/cairn/remember.go's ResolvedTier: rig beats role beats
  # agent; no scope tag at all resolves to "global".
  resolve_tier() {
    scope_json="$1"
    for t in rig role agent; do
      match=$(printf '%s' "$scope_json" | jq -r --arg t "$t" \
        'map(select(startswith($t + ":"))) | .[0] // empty')
      if [ -n "$match" ]; then
        echo "$t"
        return
      fi
    done
    echo "global"
  }

  while IFS= read -r finding; do
    ENTRY_ID=$(printf '%s' "$finding" | jq -r '.entry_id')
    TOPIC_KEY=$(printf '%s' "$finding" | jq -r '.topic_key')
    SCOPE_JSON=$(printf '%s' "$finding" | jq -c '.scope // []')
    DISUSED_SINCE=$(printf '%s' "$finding" | jq -r '.disused_since')
    ANCHOR="[entry:${ENTRY_ID}]"

    TIER=$(resolve_tier "$SCOPE_JSON")
    if [ "$TIER" != "rig" ] && [ "$TIER" != "global" ]; then
      echo "skip $ENTRY_ID: tier=$TIER out of scope for this sweep (rig/global only)"
      continue
    fi

    EXISTING=$(bd list --label=dim:cull,source:cairn-librarian \
      --title-contains="$ANCHOR" --json --no-pager 2>/dev/null | jq -r '.[0].id // empty')

    if [ -n "$EXISTING" ]; then
      echo "skip $ENTRY_ID: already tracked as $EXISTING"
      SKIPPED=$((SKIPPED + 1))
      continue
    fi

    CULL_OUTPUT=$(cairn cull-evict "$ENTRY_ID" --store "$STORE" 2>&1) || {
      echo "cairn cull-evict $ENTRY_ID failed: $CULL_OUTPUT" >&2
      continue
    }
    BRANCH=$(printf '%s' "$CULL_OUTPUT" | sed -n 's/^cull review branch: //p')

    NEW_ID=$(bd create \
        --title="cairn librarian: disuse cull proposed for \"$TOPIC_KEY\" ($TIER) $ANCHOR" \
        --stdin --type=task --priority=3 \
        --labels=dim:cull,source:cairn-librarian --silent <<BODY
Cairn entry $ENTRY_ID (topic "$TOPIC_KEY", tier $TIER) has been disused since
$DISUSED_SINCE, past the configured cull threshold (FR-10/NFR-06).

"cairn cull-evict" already opened a review-branch eviction proposal
(branch: ${BRANCH:-see cull-evict output above}) and mailed the tier's
reviewer -- this bead exists only to track that a proposal was made and
avoid re-triggering it every cycle. This is a proposal only: nothing is
evicted until a human reviewer merges the branch (crn-xw3 guardrail 8). To
resolve, the reviewer should merge the branch (entry evicted) or reject it
by not merging (entry kept; close this bead noting why, e.g. a
pinned/rare-but-critical entry).
BODY
    )
    echo "filed $NEW_ID for $ENTRY_ID ($TIER, disused since $DISUSED_SINCE)"
    FILED=$((FILED + 1))
  done < <(cairn cull-candidates --store "$STORE" | jq -c '.[]')

  echo "librarian cull sweep: $FILED bead(s) filed, $SKIPPED already tracked"
'''

[[steps]]
id = "loop"
title = "Log iteration summary, then pour the next cycle no sooner than cooldown"
needs = ["cull-candidate-beads"]
description = '''
Librarian sweep cycle complete (tier={{tier}}, rig={{rig}}). Log a one-line
summary of this cycle's outcome across all five steps (beads filed/skipped
for stale branches, freshness drift, dedup candidates, promote candidates,
and cull candidates).

Do NOT pour the next cycle immediately. This formula has no timer of its
own -- {{cooldown}} (default 24h) is a documented convention for whoever
schedules pours, not something this step enforces mechanically. When ready:

  tier=global (mayor):
    bd mol pour mol-cairn-librarian --var tier=global

  tier=rig (that rig's architect):
    bd mol pour mol-cairn-librarian --var tier=rig --var rig={{rig}}

Whether to run this on a recurring cadence at all is an operational decision
for mayor and each rig's architect, not something a single pour activates
unilaterally (crn-0yv.5 scope note). Sleep -- do not spin.
'''
